name: Daily AEO/GEO email report

# Sends the AEO/GEO progress email EVERY DAY from existing DB data — no
# measurement cycle, so NO Gemini quota is spent (cheap + reliable). The heavy
# weekly measurement stays in measure.yml (Mon); publish stays in publish.yml
# (Tue). Runs in GitHub's cloud, independent of any local PC.
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily (= 17:00 KST)
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      REPORT_TO: doradola38@gmail.com
    steps:
      - name: Guard — require DATABASE_URL + mail secrets
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "armed=false" >> "$GITHUB_OUTPUT"; else echo "armed=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then echo "mail=true" >> "$GITHUB_OUTPUT"; else echo "mail=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.armed == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.armed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.armed == 'true'
        run: npm ci
      - name: Build AEO/GEO email report (no measurement)
        if: steps.guard.outputs.armed == 'true'
        run: |
          export REPORT_STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx tsx scripts/email-report.mts
          {
            echo "MAIL_SUBJECT<<__EOF__"
            cat report-subject.txt
            echo "__EOF__"
          } >> "$GITHUB_ENV"
      - name: Send report email (Gmail SMTP)
        if: steps.guard.outputs.armed == 'true' && steps.guard.outputs.mail == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.MAIL_SUBJECT }}
          to: doradola38@gmail.com
          from: AEO/GEO Bot <${{ secrets.MAIL_USERNAME }}>
          html_body: file://report-email.html
          convert_markdown: false
