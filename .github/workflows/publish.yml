name: Auto-publish owned-net (scheduled)

# UNATTENDED weekly AEO/GEO content publish, per customer, to that customer's
# GitHub Pages hub. This is the "no manual approval" path: the §7 automated gates
# ARE the review — ONLY gate_status='passed' assets are ever queued/published,
# the automated sign-off is recorded (§12 audit), and every page is reversible.
#
# Requires repo secrets:
#   DATABASE_URL     Timescale Cloud connection string (already used by measure.yml)
#   GEMINI_API_KEY   Gemini key (generation only)
#   HUB_PUSH_TOKEN   GitHub PAT with contents:write on the hub repos
# Until these are set, scheduled runs are a green no-op (guard exits early).
on:
  schedule:
    - cron: "0 4 * * 2" # 04:00 UTC every Tuesday (offset from the Monday measure cron)
  workflow_dispatch:
    inputs:
      customer:
        description: "customer slug (smimdate) or 'all'"
        default: all
      attempts:
        description: "generation attempts per customer (accumulate passes)"
        default: "3"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Free-tier Gemini keys hit 429s that the adapter absorbs via backoff waits,
    # which lengthens runs — give ample headroom so publish/push still happens.
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional comma-separated pool of Gemini keys from SEPARATE Google Cloud
      # projects/accounts — takes priority over GEMINI_API_KEY when set. The
      # adapter round-robins across them and fails over to the next key
      # immediately on a 429 instead of waiting, multiplying effective RPM.
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GH_TOKEN: ${{ secrets.HUB_PUSH_TOKEN }}
      LOG_LEVEL: warn
      CONTENT_RUN_CEILING_USD: "5"
      # Modest per-run generation load so free-tier rate limits stay manageable.
      ATTEMPTS: ${{ github.event.inputs.attempts || '2' }}
      TOTAL: "10"
      WHICH: ${{ github.event.inputs.customer || 'all' }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      REPORT_TO: doradola38@gmail.com
      # Search Console ownership-verification file (public token) — durably
      # re-emitted to each hub root by gen-hub-index so GSC verification survives
      # rebuilds. Bing: set BING_SITE_AUTH once the owner provides the code.
      GSC_VERIFICATION_FILE: google871e8ec1d063f81f.html
    steps:
      - name: Guard — require secrets (skip gracefully until armed)
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GH_TOKEN" ]; then
            echo "DATABASE_URL / HUB_PUSH_TOKEN not set — auto-publish not armed. Skipping (no-op)."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "mail=true" >> "$GITHUB_OUTPUT"
          else
            echo "mail=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.armed == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.armed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.armed == 'true'
        run: npm ci
      - name: Apply migrations (idempotent)
        if: steps.guard.outputs.armed == 'true'
        run: npm run migrate

      - name: Auto-publish each armed customer
        if: steps.guard.outputs.armed == 'true'
        run: |
          set -uo pipefail
          # Per-customer config: slug|customerId|industry|hubRepo|hubBaseUrl|brand
          # IDs are for the LIVE Neon DB (migrated off Timescale Cloud 2026-09-05
          # after its free trial ended and the instance was torn down — see
          # HANDOFF.md "session 4"). Verified by slug lookup on the new DB:
          #   unsanpartners = 41b57266 (auto-repair-matchmaking, 3rd customer, onboarded 2026-09-05)
          #   sharejoa     = 2264f4a3 (subscription-sharing, 4th customer, onboarded 2026-09-06)
          #   emora         = 768167a5 (canonical `emora` slug, re-onboarded on Neon 2026-09-05;
          #                              19 legacy hub pages backfilled into url_registry)
          # smim removed from the active roster 2026-09-05 (owner directive) — its DB
          # rows/hub repo (sonjeongwons/aeo-smim-hub)/config are left intact, not deleted.
          CONFIGS=(
            "unsanpartners|41b57266-1796-4ac5-92a9-395420d891de|auto-repair-matchmaking|sonjeongwons/aeo-unsanpartners-hub|https://sonjeongwons.github.io/aeo-unsanpartners-hub|unsanpartners"
            "sharejoa|2264f4a3-0aa5-4054-a6c8-e16313326be1|subscription-sharing|sonjeongwons/aeo-sharejoa-hub|https://sonjeongwons.github.io/aeo-sharejoa-hub|sharejoa"
            "emora|768167a5-6c1f-4d0a-8cf8-33a0e6f4eb41|ai-character-chat|sonjeongwons/aeo-owned-net-hub|https://sonjeongwons.github.io/aeo-owned-net-hub|emora"
          )
          for cfg in "${CONFIGS[@]}"; do
            IFS='|' read -r slug cid industry repo baseurl brand <<< "$cfg"
            if [ "$WHICH" != "all" ] && [ "$WHICH" != "$slug" ]; then continue; fi
            echo "::group::auto-publish $slug"
            outdir=".hub-$slug"
            rm -rf "$outdir"
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$outdir" || { echo "clone failed"; echo "::endgroup::"; continue; }
            CUSTOMER_ID="$cid" INDUSTRY="$industry" HUB_REPO="$repo" \
              OWNED_NET_HUB_BASE_URL="$baseurl" OWNED_NET_OUT_DIR="./$outdir" HUB_BRAND="$brand" \
              APPROVER="auto-publish@aeo (owner-authorized)" \
              bash scripts/auto-publish.sh || echo "auto-publish $slug returned nonzero (continuing)"
            echo "::endgroup::"
          done

      # ---- Post-publish AEO/GEO progress email (cumulative + improvement) ----
      - name: Build AEO/GEO email report
        if: steps.guard.outputs.armed == 'true'
        run: |
          export REPORT_STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx tsx scripts/email-report.mts
          {
            echo "MAIL_SUBJECT<<__EOF__"
            cat report-subject.txt
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Send report email (Gmail SMTP)
        if: steps.guard.outputs.armed == 'true' && steps.guard.outputs.mail == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.MAIL_SUBJECT }}
          to: doradola38@gmail.com
          from: AEO/GEO Bot <${{ secrets.MAIL_USERNAME }}>
          html_body: file://report-email.html
          convert_markdown: false
