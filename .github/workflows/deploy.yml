name: Deploy dashboard (Vercel)

# Deploys apps/web to Vercel on push to main. Requires repo secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID  (already set)
#   DATABASE_URL  (set once a Timescale Cloud DB exists — until then the deploy
#                  still builds if the DB-reading pages are dynamic; runtime data
#                  pages need it). Also mirror DATABASE_URL/GEMINI_API_KEY into the
#                  Vercel project env for RUNTIME.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Guard — require DATABASE_URL (skip gracefully until armed)
        id: guard
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL not set — dashboard needs the cloud DB. Skipping deploy (no-op)."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.armed == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.armed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: steps.guard.outputs.armed == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings (production)
        if: steps.guard.outputs.armed == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel, respects project rootDirectory=apps/web)
        if: steps.guard.outputs.armed == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        if: steps.guard.outputs.armed == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
