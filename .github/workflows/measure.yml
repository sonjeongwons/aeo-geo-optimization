name: Measurement cycle (scheduled)

# Runs a bounded AEO/GEO measurement cycle against the cloud TimescaleDB and
# writes SMR / earned-source / etc. Requires repo secrets DATABASE_URL (Timescale
# Cloud) + GEMINI_API_KEY. Until DATABASE_URL is set, scheduled runs are a green
# no-op (the guard step exits early).
#
# Cost control: GEMINI_GROUNDING_SAMPLE_PCT grounds only ~N% of work-units (bounded
# Search-tool spend); the per-customer weekly_usd_cap bounds token spend.
on:
  schedule:
    - cron: "0 3 * * 1" # 03:00 UTC every Monday (weekly baseline)
  workflow_dispatch:
    inputs:
      customer:
        description: customer slug
        default: emora
      grounding_pct:
        description: "% of work-units to ground (0-100)"
        default: "3"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GROUNDING_SAMPLE_PCT: ${{ github.event.inputs.grounding_pct || '3' }}
      LOG_LEVEL: info
      # Space-separated list of customer slugs; dispatch input overrides.
      CUSTOMERS: ${{ github.event.inputs.customer || 'emora-mini smimdate' }}
      # Email report delivery (Gmail SMTP). Set MAIL_USERNAME + MAIL_PASSWORD
      # (a Gmail App Password) secrets to arm; unset → report built but not sent.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      REPORT_TO: doradola38@gmail.com
    steps:
      - name: Guard — require DATABASE_URL (skip gracefully until armed)
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not set — measurement not armed yet. Skipping (no-op)."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "mail=true" >> "$GITHUB_OUTPUT"
          else
            echo "mail=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.armed == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.armed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.armed == 'true'
        run: npm ci
      - name: Apply migrations (idempotent)
        if: steps.guard.outputs.armed == 'true'
        run: npm run migrate
      - name: Run measurement cycle (each customer, sequential — shared Gemini budget)
        if: steps.guard.outputs.armed == 'true'
        run: |
          for c in $CUSTOMERS; do
            echo "::group::measure $c"
            npm run diagnose -- --customer "$c" > "report-$c.json" 2> "diagnose-$c.log" || { echo "FAILED $c"; tail -40 "diagnose-$c.log"; }
            node -e '
              const fs=require("fs");const f=process.argv[1];
              try{const t=fs.readFileSync(f,"utf8").split(/\r?\n/);
              let s=-1;for(let i=t.length-1;i>=0;i--)if(t[i]==="{"){s=i;break;}
              let e=-1;for(let i=s+1;i<t.length;i++)if(t[i]==="}"){e=i;break;}
              const r=JSON.parse(t.slice(s,e+1).join("\n"));
              console.log(process.argv[2],"| runId",r.runId,"| smr",r.smr?.value,"| nTotal",r.smr?.nTotal,"| earnedDomains",(r.earnedSources?.domains||[]).length);
              }catch(err){console.log(process.argv[2],"| no report parsed");}
            ' "report-$c.json" "$c"
            echo "::endgroup::"
          done
      - name: Upload report artifact
        if: steps.guard.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-reports
          path: report-*.json
          if-no-files-found: ignore

      # ---- AEO/GEO progress email (cumulative history + WoW improvement) ----
      - name: Build AEO/GEO email report
        if: steps.guard.outputs.armed == 'true'
        run: |
          export REPORT_STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx tsx scripts/email-report.mts
          {
            echo "MAIL_SUBJECT<<__EOF__"
            cat report-subject.txt
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Send report email (Gmail SMTP)
        if: steps.guard.outputs.armed == 'true' && steps.guard.outputs.mail == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.MAIL_SUBJECT }}
          to: doradola38@gmail.com
          from: AEO/GEO Bot <${{ secrets.MAIL_USERNAME }}>
          html_body: file://report-email.html
          convert_markdown: false
