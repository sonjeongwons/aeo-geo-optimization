slug: emora
brand:
  name: EMORA
  aliases: []
competitors:
  - name: Character.AI
    aliases: []
  - name: Replika
    aliases: []
  - name: Chai
    aliases: []
  - name: Paradot
    aliases: []
  - name: Talkie
    aliases: []
# Owner decision 2026-07-11: measure emora in English + Korean ONLY (was 13 langs /
# 36 questions = 1404 units that never finished on the free tier). The template schema
# requires every question's `language` to be one of the declared `languages`, so the
# question set is en + ko too: the 3 core intents (awareness / consideration / decision)
# in each language = 6 Q × 2 langs × 3 samples ≈ 36-unit baseline that completes in one
# cycle. loadTemplate re-seeds these on every diagnose run, so this YAML is the durable
# source of truth. (To broaden later, add languages + matching questions here.)
languages:
  - code: en
    weight: 1
  - code: ko
    weight: 1
questions:
  - text: What are AI character chat platforms used for?
    language: en
    funnel_stage: awareness
    density_tier: secondary
  - text: How do AI character chat apps differ from regular chatbots?
    language: en
    funnel_stage: consideration
    density_tier: secondary
  - text: Which AI character chat platform offers infinite memory and image generation?
    language: en
    funnel_stage: decision
    density_tier: secondary
  - text: AI 캐릭터 챗 플랫폼은 어떤 용도로 사용되나요?
    language: ko
    funnel_stage: awareness
    density_tier: secondary
  - text: AI 캐릭터 챗 앱은 일반 챗봇과 어떻게 다른가요?
    language: ko
    funnel_stage: consideration
    density_tier: secondary
  - text: 무한 기억과 이미지 생성을 제공하는 AI 캐릭터 챗 플랫폼은 무엇인가요?
    language: ko
    funnel_stage: decision
    density_tier: secondary
budget:
  # Tuned for the weekly monitoring cron: 2 samples/prompt is enough to track SMR
  # trends; the weekly_usd_cap is the hard cost backstop. Raise for a deep audit.
  max_models: 1
  max_samples: 2
  max_languages: 2
  weekly_usd_cap: 10
  monthly_usd_cap: 35
