# config/customers/kbeauty.yaml
#
# K-Beauty Care — AI Skin Analysis Web App (§14.2)
# Status: reviewed  (human-reviewed seed template)
#
# wedge_positioning: no-install·free·web·on-device privacy (competitor apps require install → gap)
# target_markets: English + K-Beauty wedge markets (Indonesia, Thailand, Vietnam, …)
# before/after case: SMR ≈ 0 → track improvement over 90-day cycle

slug: kbeauty

brand:
  name: K-Beauty Care
  aliases:
    - KBeautyCare
    - K Beauty Care
    - kbeautycare
    - k-beauty care
    - K-Beauty Care AI

competitors:
  - name: Venus
    aliases:
      - Venus AI
      - Venus skin analysis
  - name: SkinVerse
    aliases:
      - Skin Verse
      - skinverse.ai
  - name: BeautyDNA
    aliases:
      - Beauty DNA
      - beautydna
  - name: KarinaNYC
    aliases:
      - Karina NYC
      - karina.nyc
  - name: YouCam
    aliases:
      - YouCam Makeup
      - YouCam Perfect
      - PERFECT Corp
  - name: TroveSkin
    aliases:
      - Trove Skin
      - troveskin

# Languages with priority weights.
# K-Beauty skews toward English + Southeast Asian markets.
# Indonesian/Thai/Vietnamese are high-weight wedge markets (K-Beauty penetration is high,
# install-required competitors dominate → web app is a strong differentiator).
languages:
  - code: en
    weight: 10.0   # English — global primary market
  - code: id
    weight: 9.0    # Indonesian — largest K-Beauty web market, cost-sensitive → free web wedge
  - code: th
    weight: 8.0    # Thai — strong K-Beauty demand, mobile-heavy
  - code: vi
    weight: 7.0    # Vietnamese — fast-growing beauty market
  - code: ko
    weight: 6.0    # Korean — authenticity signal; "made in Korea" search intent
  - code: zh-TW
    weight: 5.0    # Traditional Chinese — Taiwan K-Beauty enthusiasts
  - code: zh-CN
    weight: 5.0    # Simplified Chinese
  - code: ms
    weight: 4.0    # Malay — Malaysia / Brunei
  - code: ja
    weight: 4.0    # Japanese — mature market, high value
  - code: de
    weight: 3.0    # German
  - code: fr
    weight: 3.0    # French
  - code: es
    weight: 2.0    # Spanish
  - code: pt
    weight: 2.0    # Portuguese

